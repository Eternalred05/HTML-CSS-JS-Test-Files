<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚔️ Laboratorio 2 — Arena de Combate RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Fira+Code:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scanlines"></div>

  <!-- ══════════════════════════════════════════════ -->
  <!-- HEADER                                         -->
  <!-- ══════════════════════════════════════════════ -->
  <header class="header">
    <div class="header__emblem">⚔️</div>
    <h1 class="header__title">Arena de Combate RPG</h1>
  </header>

  <!-- ══════════════════════════════════════════════ -->
  <!-- SETUP PANEL                                    -->
  <!-- ══════════════════════════════════════════════ -->
  <section class="setup" id="setup-panel">
    <h2 class="section-title"><span class="section-title__icon">👤</span> Crear Personaje</h2>

    <div class="setup__form">
      <div class="field">
        <label for="char-name">Nombre</label>
        <input type="text" id="char-name" placeholder="Ej: Arthas" maxlength="20" />
      </div>

      <div class="field">
        <label for="char-class">Clase</label>
        <select id="char-class">
          <option value="Guerrero">🗡️ Guerrero</option>
          <option value="Mago">🔮 Mago</option>
          <option value="Arquero">🏹 Arquero</option>
        </select>
      </div>

      <div class="field">
        <label for="char-level">Nivel</label>
        <input type="number" id="char-level" min="1" max="10" value="1" />
      </div>

      <div class="field">
        <label for="char-race">Raza</label>
        <select id="char-race">
          <option value="Humano">🧑 Humano</option>
          <option value="Elfo">🧝 Elfo</option>
          <option value="Enano">⛏️ Enano</option>
        </select>
      </div>

      <button class="btn btn--primary" id="btn-create">Insertar</button>
    </div>

    <!-- PARTY ROSTER -->
    <div class="roster" id="roster">
      <h3 class="roster__title">Equipo <span id="roster-count">0</span>/3</h3>
      <div class="roster__list" id="roster-list"></div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════ -->
  <!-- BATTLE ARENA                                   -->
  <!-- ══════════════════════════════════════════════ -->
  <section class="arena hidden" id="arena-panel">
    <h2 class="section-title"><span class="section-title__icon">⚔️</span> Campo de Batalla — Turno <span id="turn-number">1</span></h2>

    <!-- HEROES -->
    <div class="arena__sides">
      <div class="arena__team arena__team--heroes">
        <h3 class="arena__team-label">— Héroes —</h3>
        <div class="arena__cards" id="hero-cards"></div>
      </div>

      <div class="arena__vs">VS</div>

      <!-- ENEMIES -->
      <div class="arena__team arena__team--enemies">
        <h3 class="arena__team-label">— Enemigos —</h3>
        <div class="arena__cards" id="enemy-cards"></div>
      </div>
    </div>

    <!-- ACTION BAR -->
    <div class="actions" id="action-bar">
      <p class="actions__prompt">Turno de: <strong id="current-actor">—</strong></p>
      <div class="actions__buttons">
        <button class="btn btn--attack" id="btn-attack">⚔️ Atacar</button>
        <button class="btn btn--skill" id="btn-skill">✨ Habilidad Especial</button>
        <button class="btn btn--defend" id="btn-defend">🛡️ Defenderse</button>
      </div>
      <div class="target-selector hidden" id="target-selector">
        <p>Selecciona objetivo:</p>
        <div id="target-buttons"></div>
      </div>
    </div>

    <!-- COMBAT LOG -->
    <div class="combat-log">
      <h3 class="combat-log__title">📜 Registro de Combate</h3>
      <div class="combat-log__entries" id="log-entries"></div>
    </div>

    <!-- STATS PANEL -->
    <div class="stats-panel">
      <h3 class="stats-panel__title">📊 Estadísticas</h3>
      <div class="stats-panel__grid" id="stats-grid">
        <div class="stat-card">
          <span class="stat-card__label">Personajes Creados</span>
          <span class="stat-card__value" id="stat-created">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">Daño Total Infligido</span>
          <span class="stat-card__value" id="stat-damage">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">Mayor Golpe</span>
          <span class="stat-card__value" id="stat-max-hit">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">Personajes Derrotados</span>
          <span class="stat-card__value" id="stat-defeated">0</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════ -->
  <!-- GAME OVER OVERLAY                              -->
  <!-- ══════════════════════════════════════════════ -->
  <div class="overlay hidden" id="game-over">
    <div class="overlay__box">
      <h2 class="overlay__title" id="game-over-title">—</h2>
      <p class="overlay__text" id="game-over-text"></p>
      <button class="btn btn--primary" onclick="location.reload()">🔄 Jugar de Nuevo</button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="personajes.js"></script>
  <script src="game.js"></script>
</body>
</html>
